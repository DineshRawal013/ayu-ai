# Ayu AI v2: microservices on four private networks.
#
#   frontend-net:  caddy, frontend, gateway        (web tier: browser traffic reaches the API gateway)
#   services-net:  gateway, health-svc, kundali-svc, ai-svc   (internal: no internet access)
#   data-net:      gateway, postgres               (internal: only the gateway reaches the database)
#   ai-net:        ai-svc, ollama                  (only ai-svc reaches the model; not internal,
#                                                   because ollama downloads the model on first start)
#
#   caddy (optional)  -> HTTPS on 80/443 in front of frontend (profile "https", Azure only)
#   frontend (nginx)  -> public port 80, proxies /api to gateway
#   gateway           -> public API, results DB, share links, place search; calls the services
#   health-svc        -> age, health metrics, lifespan estimate
#   kundali-svc       -> birth chart, dasha, transits (Swiss Ephemeris)
#   ai-svc            -> insight and lifespan-guess prompts for Ollama
#   postgres, ollama  -> no public ports
#
# Local:   cd 4-implementation && docker compose up --build
# Azure:   production runs on Azure Container Apps (../6-deployment/azure), not from this file

name: ayu-ai

services:
  frontend:
    build: ./frontend
    image: ghcr.io/${GHCR_OWNER:-dineshrawal013}/ayu-ai-frontend:${TAG:-latest}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - frontend-net
    restart: unless-stopped

  # HTTPS on Azure only: started when .env sets COMPOSE_PROFILES=https and DOMAIN.
  # Then set HTTP_PORT=127.0.0.1:8080 so the frontend is no longer public on port 80.
  caddy:
    image: caddy:2.8-alpine
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      # The folder, not the file: the deploy replaces the file, and a file mount would keep the old one.
      - ../6-deployment/scripts/old-vm/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - frontend-net
    restart: unless-stopped

  gateway:
    build: ./services/gateway
    image: ghcr.io/${GHCR_OWNER:-dineshrawal013}/ayu-ai-gateway:${TAG:-latest}
    environment:
      # Password goes in PGPASSWORD (read by pg) so symbols in it can't break the URL.
      DATABASE_URL: postgres://${POSTGRES_USER:-ayu}@postgres:5432/${POSTGRES_DB:-ayu}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      HEALTH_URL: http://health-svc:3001
      KUNDALI_URL: http://kundali-svc:3002
      AI_URL: http://ai-svc:3003
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-AyuAI/1.0 (https://github.com/DineshRawal013/ayu-ai)}
    depends_on:
      postgres:
        condition: service_healthy
      health-svc:
        condition: service_healthy
      kundali-svc:
        condition: service_healthy
      # Only started, not healthy: the site works without the AI (the insight returns 503),
      # so a slow or broken ai-svc must not keep the gateway and frontend down.
      ai-svc:
        condition: service_started
    networks:
      - frontend-net
      - services-net
      - data-net
    restart: unless-stopped

  health-svc:
    build: ./services/health-svc
    image: ghcr.io/${GHCR_OWNER:-dineshrawal013}/ayu-ai-health-svc:${TAG:-latest}
    networks:
      - services-net
    restart: unless-stopped

  kundali-svc:
    build: ./services/kundali-svc
    image: ghcr.io/${GHCR_OWNER:-dineshrawal013}/ayu-ai-kundali-svc:${TAG:-latest}
    networks:
      - services-net
    restart: unless-stopped

  ai-svc:
    build: ./services/ai-svc
    image: ghcr.io/${GHCR_OWNER:-dineshrawal013}/ayu-ai-ai-svc:${TAG:-latest}
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    depends_on:
      ollama:
        condition: service_started
    networks:
      - services-net
      - ai-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ayu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ayu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data-net
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "/ayu/entrypoint.sh"]
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: 2
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/entrypoint.sh:/ayu/entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ai-net
    restart: unless-stopped

networks:
  frontend-net:
    driver: bridge
  services-net:
    driver: bridge
    internal: true
  data-net:
    driver: bridge
    internal: true
  # Not "internal: true": ollama needs internet to pull the model on first start.
  ai-net:
    driver: bridge

volumes:
  pgdata:
  ollama_data:
  caddy_data:
  caddy_config:
