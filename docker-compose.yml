# Ayu AI: 4 containers on two private networks.
#   frontend-net: caddy, frontend, backend  (web tier: browser traffic reaches the API)
#   backend-net:  backend, postgres, ollama (data tier: only the backend talks to DB and AI)
#   backend is on both, so it is the only bridge between the tiers.
#   caddy (optional)  -> HTTPS on 80/443 in front of frontend (profile "https", Azure only)
#   frontend (nginx)  -> public port 80, proxies /api to backend
#   backend (Express) -> talks to postgres and ollama internally
#   postgres          -> no public port
#   ollama            -> no public port, pulls the model on first start
#
# Local:   docker compose up --build
# Azure:   images come from GHCR (see .github/workflows/deploy.yml)

name: ayu-ai

services:
  frontend:
    build: ./frontend
    image: ghcr.io/${GHCR_OWNER:-dineshrawal013}/ayu-ai-frontend:${TAG:-latest}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-net
    restart: unless-stopped

  # HTTPS on Azure only: started when .env sets COMPOSE_PROFILES=https and DOMAIN.
  # Then set HTTP_PORT=127.0.0.1:8080 so the frontend is no longer public on port 80.
  caddy:
    image: caddy:2.8-alpine
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      # The folder, not the file: the deploy replaces the file, and a file mount would keep the old one.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - frontend-net
    restart: unless-stopped

  backend:
    build: ./backend
    image: ghcr.io/${GHCR_OWNER:-dineshrawal013}/ayu-ai-backend:${TAG:-latest}
    environment:
      # Password goes in PGPASSWORD (read by pg) so symbols in it can't break the URL.
      DATABASE_URL: postgres://${POSTGRES_USER:-ayu}@postgres:5432/${POSTGRES_DB:-ayu}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-AyuAI/1.0 (https://github.com/DineshRawal013/ayu-ai)}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - frontend-net
      - backend-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ayu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ayu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend-net
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "/ayu/entrypoint.sh"]
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: 2
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/entrypoint.sh:/ayu/entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend-net
    restart: unless-stopped

networks:
  frontend-net:
    driver: bridge
  # Not "internal: true": ollama needs internet to pull the model on first start.
  backend-net:
    driver: bridge

volumes:
  pgdata:
  ollama_data:
  caddy_data:
  caddy_config:
